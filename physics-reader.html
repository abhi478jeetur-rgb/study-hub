<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Physics Flash Reader</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#000;--fg:#f4f4f4;--dim:#7d7d7d;--faint:#262626;--red:#e8334a;--ok:#3ddc84;--bad:#ff5a5a;
  --f:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--fg);font-family:var(--f);overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--red);outline-offset:3px;border-radius:8px}
sup,sub{font-size:.62em;line-height:0}

/* top strip */
.top{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:18px 24px;color:var(--dim);font-size:15px;z-index:3;transition:opacity .4s}
.top .qno b{color:var(--fg)}
.prog{position:fixed;top:0;left:0;height:2px;background:var(--red);transition:width .3s;z-index:4}
.star{font-size:22px;color:var(--dim);transition:transform .2s,color .2s}
.star.on{color:#ffcc33}
.star:active{transform:scale(1.3)}

/* stage */
.stage{position:fixed;inset:0;display:grid;place-items:center;cursor:pointer;user-select:none}
.reticle{position:relative;width:min(92vw,900px);height:200px;font-size:clamp(40px,7vw,72px)}
.reticle::before,.reticle::after{content:"";position:absolute;left:calc(var(--pivot) + .3em);width:2px;height:34px;background:var(--red);transform:translateX(-50%);opacity:.9}
.reticle::before{top:6px}.reticle::after{bottom:6px}
.word{position:absolute;top:50%;left:0;right:0;transform:translateY(-50%);display:grid;grid-template-columns:var(--pivot) auto 1fr;align-items:baseline;
  font-size:clamp(40px,7vw,72px);font-weight:700;letter-spacing:.01em;white-space:nowrap}
.word .l{text-align:right}
.word .p{color:var(--red)}
.word .r{text-align:left}
.word.free{display:block;text-align:center}
.cue{position:absolute;left:0;right:0;top:20px;text-align:center;font-size:14px;color:var(--dim);letter-spacing:.04em;opacity:0;transition:opacity .3s}
.cue.on{opacity:1}
.answer{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);text-align:center;font-weight:700;font-size:clamp(30px,5vw,54px);color:var(--ok);padding:0 12px;
  opacity:0;line-height:1.2}
.answer.on{animation:ans .35s ease forwards}
@keyframes ans{from{opacity:0;transform:translateY(-40%) scale(.96)}to{opacity:1;transform:translateY(-50%)}}
.hold{position:absolute;left:30%;right:30%;bottom:-6px;height:2px;background:var(--faint);overflow:hidden;opacity:0}
.hold.on{opacity:1}
.hold i{display:block;height:100%;width:0;background:var(--ok)}
.hint{position:fixed;left:0;right:0;bottom:118px;text-align:center;color:var(--dim);font-size:14px;transition:opacity .4s}

/* dock */
.dock{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);display:flex;align-items:center;gap:6px;padding:8px 10px;border-radius:18px;
  background:#0e0e0e;border:1px solid var(--faint);z-index:3;transition:opacity .4s,transform .4s;flex-wrap:wrap;justify-content:center;max-width:96vw}
.btn{height:44px;min-width:44px;padding:0 12px;border-radius:12px;display:grid;place-items:center;font-size:15px;color:var(--fg)}
.btn:hover{background:#1b1b1b}
.btn.play{background:var(--fg);color:#000;font-weight:700;min-width:96px}
.btn.play:hover{background:#fff}
.speed{display:flex;align-items:center;gap:8px;padding:0 10px;color:var(--dim);font-size:14px}
.speed b{color:var(--fg);min-width:74px;display:inline-block;text-align:right;font-variant-numeric:tabular-nums}
input[type=range]{-webkit-appearance:none;appearance:none;width:130px;height:4px;border-radius:4px;background:#2a2a2a}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:var(--red)}
input[type=range]::-moz-range-thumb{width:16px;height:16px;border:0;border-radius:50%;background:var(--red)}
.sep{width:1px;height:26px;background:var(--faint);margin:0 4px}
body.playing.idle .dock,body.playing.idle .top,body.playing.idle .hint{opacity:0;pointer-events:none}
body.playing.idle{cursor:none}

/* paused sheet */
.sheet{position:fixed;left:50%;bottom:92px;transform:translate(-50%,24px);width:min(760px,94vw);max-height:62vh;overflow:auto;padding:22px 24px;border-radius:20px;
  background:#0b0b0b;border:1px solid var(--faint);opacity:0;pointer-events:none;transition:opacity .3s,transform .3s;z-index:2}
body.paused .sheet{opacity:1;transform:translate(-50%,0);pointer-events:auto}
body.paused .stage .reticle{opacity:.12;transition:opacity .3s}
.sheet .full{font-size:22px;line-height:1.5;margin-bottom:16px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media(max-width:600px){.opts{grid-template-columns:1fr}.speed input{width:90px}}
.opt{text-align:left;padding:12px 14px;border-radius:12px;border:1px solid #2c2c2c;font-size:17px;display:flex;gap:10px;transition:border-color .2s,background .2s}
.opt:hover:not(:disabled){border-color:var(--fg)}
.opt span:first-child{color:var(--dim);font-weight:700}
.opt.ok{border-color:var(--ok);background:rgba(61,220,132,.1)}
.opt.bad{border-color:var(--bad);background:rgba(255,90,90,.1)}
.sheet .row{display:flex;justify-content:space-between;align-items:center;margin-top:14px;color:var(--dim);font-size:14px;gap:10px;flex-wrap:wrap}
.link{color:var(--fg);text-decoration:underline;text-underline-offset:3px}
.reveal{font-size:19px;color:var(--ok);font-weight:700}

/* menu */
.menu{position:fixed;inset:0;background:rgba(0,0,0,.86);display:none;place-items:center;z-index:9}
.menu.on{display:grid}
.mbox{width:min(460px,92vw);background:#0b0b0b;border:1px solid var(--faint);border-radius:20px;padding:24px}
.mbox h2{font-size:24px;margin-bottom:16px}
.mrow{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-top:1px solid #1a1a1a;gap:12px}
.mrow label{color:#cfcfcf}
.mrow small{display:block;color:var(--dim);font-size:13px}
select,.num{background:#151515;color:var(--fg);border:1px solid #2c2c2c;border-radius:10px;padding:8px 10px;font:inherit}
.num{width:90px}
.seg{display:flex;gap:4px}
.seg button{padding:7px 12px;border-radius:9px;border:1px solid #2c2c2c;font-size:14px}
.seg button[aria-pressed=true]{background:var(--fg);color:#000;border-color:var(--fg)}
.keys{color:var(--dim);font-size:13px;margin-top:14px;line-height:1.8}
kbd{border:1px solid #333;border-bottom-width:2px;border-radius:5px;padding:0 5px;color:#ddd;font-family:inherit}
.done{position:fixed;inset:0;display:none;place-items:center;text-align:center;z-index:8;background:#000}
.done.on{display:grid}
.done h2{font-size:clamp(34px,6vw,60px)}
.done p{color:var(--dim);margin:10px 0 24px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.answer.on{opacity:1}}
</style>
</head>
<body class="paused">
<div class="prog" id="prog"></div>
<div class="top">
  <span class="qno">Question <b id="qi">1</b> of <b id="qn">175</b></span>
  <span style="display:flex;gap:14px;align-items:center">
    <button class="star" id="star" title="Mark as hard (H)" aria-label="Mark as hard">★</button>
    <button class="btn" id="menuBtn" aria-label="Settings">⚙</button>
  </span>
</div>

<div class="stage" id="stage">
  <div class="reticle" id="reticle">
    <div class="cue" id="cue">Answer</div>
    <div class="word" id="word"></div>
    <div class="answer" id="answer"></div>
    <div class="hold" id="hold"><i id="holdBar"></i></div>
  </div>
</div>
<p class="hint" id="hint">Press Space or tap the screen to start reading</p>

<div class="sheet" id="sheet">
  <div class="full" id="full"></div>
  <div class="opts" id="opts"></div>
  <div class="row"><span id="sheetMsg">Pick the answer you think is right, or reveal it.</span><button class="link" id="revealBtn">Show answer</button></div>
</div>

<div class="dock" id="dock">
  <button class="btn" id="prevQ" title="Previous question (←)" aria-label="Previous question">⏮</button>
  <button class="btn" id="back" title="Restart this question (R)" aria-label="Restart this question">↺</button>
  <button class="btn play" id="play">Play</button>
  <button class="btn" id="nextQ" title="Next question (→)" aria-label="Next question">⏭</button>
  <span class="sep"></span>
  <button class="btn" id="slower" aria-label="Slower">−</button>
  <div class="speed"><input type="range" id="wpm" min="100" max="900" step="25" value="300" aria-label="Reading speed"><b id="wpmLbl">300 wpm</b></div>
  <button class="btn" id="faster" aria-label="Faster">+</button>
</div>

<div class="menu" id="menu"><div class="mbox">
  <h2>Reading settings</h2>
  <div class="mrow"><label>Answer stays for<small>before the next question starts</small></label>
    <select id="holdSel"><option value="1">1 s</option><option value="2" selected>2 s</option><option value="3">3 s</option><option value="5">5 s</option></select></div>
  <div class="mrow"><label>Words at a time</label><div class="seg" id="chunkSeg"><button data-v="1" aria-pressed="true">1</button><button data-v="2">2</button><button data-v="3">3</button></div></div>
  <div class="mrow"><label>Which questions</label><div class="seg" id="setSeg"><button data-v="all" aria-pressed="true">All</button><button data-v="hard">Marked hard</button></div></div>
  <div class="mrow"><label>Order</label><div class="seg" id="ordSeg"><button data-v="seq" aria-pressed="true">As listed</button><button data-v="shuffle">Shuffled</button></div></div>
  <div class="mrow"><label>Jump to question</label><input class="num" id="jump" type="number" min="1" max="175" value="1"></div>
  <div class="mrow"><label>Pause after each answer<small>so you can try it yourself first</small></label><div class="seg" id="quizSeg"><button data-v="off" aria-pressed="true">Off</button><button data-v="on">On</button></div></div>
  <p class="keys"><kbd>Space</kbd> play or pause · <kbd>←</kbd> <kbd>→</kbd> question · <kbd>↑</kbd> <kbd>↓</kbd> speed · <kbd>R</kbd> restart question · <kbd>A</kbd> show answer · <kbd>H</kbd> mark hard · <kbd>1</kbd>–<kbd>4</kbd> pick option</p>
  <div style="text-align:right;margin-top:14px"><button class="btn play" id="menuClose">Done</button></div>
</div></div>

<div class="done" id="done"><div><h2>Set finished</h2><p id="doneMsg"></p>
  <button class="btn play" id="again" style="display:inline-grid">Read again</button>
  <button class="btn" id="hardOnly" style="display:inline-grid;margin-left:8px;border:1px solid #333">Read marked hard only</button></div></div>

<script>
(() => {
const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
const store = { get: (k, d) => { try { const v = localStorage.getItem('pfr_' + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set: (k, v) => { try { localStorage.setItem('pfr_' + k, JSON.stringify(v)); } catch (e) {} } };
const S = { wpm: store.get('wpm', 300), hold: store.get('hold', 2), chunk: store.get('chunk', 1), set: 'all', order: 'seq', quiz: 'off' };
let hard = new Set(store.get('hard', []));
let order = [], oi = store.get('last', 0), tokens = [], ti = 0, phase = 'words', playing = false, tmr = null, holdStart = 0, raf = null;

// ---------- tokenising (keeps <sup>/<sub> intact, glues math symbols) ----------
function tokenize(html) {
  const raw = html.replace(/\s+/g, ' ').trim().split(' ');
  const glue = /^(×|=|∝|→|\/|:|·|&gt;|&lt;|[+−-])$/;
  const out = [];
  for (let k = 0; k < raw.length; k++) {
    let t = raw[k];
    if (glue.test(t) && out.length && k + 1 < raw.length) { out[out.length - 1] += ' ' + t + ' ' + raw[++k]; continue; }
    out.push(t);
  }
  if (S.chunk > 1) { const c = []; for (let k = 0; k < out.length; k += S.chunk) c.push(out.slice(k, k + S.chunk).join(' ')); return c; }
  return out;
}
const plain = h => { const d = document.createElement('div'); d.innerHTML = h; return d.textContent; };
function pivotIndex(n) { return n <= 1 ? 0 : n <= 5 ? 1 : n <= 9 ? 2 : n <= 13 ? 3 : 4; }
function showToken(t) {
  const w = $('#word');
  if (/[<&]/.test(t) || t.includes(' ')) { w.className = 'word free'; w.innerHTML = t; return; }
  const p = pivotIndex(t.replace(/[^\p{L}\p{N}]/gu, '').length), i = Math.min(p + (t.match(/^[^\p{L}\p{N}]*/u)[0].length), t.length - 1);
  w.className = 'word'; w.innerHTML = `<span class="l">${t.slice(0, i)}</span><span class="p">${t[i]}</span><span class="r">${t.slice(i + 1)}</span>`;
}
function delayFor(t) {
  const base = 60000 / S.wpm * (S.chunk > 1 ? S.chunk * .8 : 1), len = plain(t).length;
  let m = 1;
  if (len > 8) m += .3; if (len > 12) m += .3;
  if (/[<]/.test(t) || /\d/.test(t)) m += .6;          // numbers and formulas need a beat
  if (/[,;:]$/.test(t)) m += .5; if (/[.?!]$/.test(t)) m += .9;
  return base * m;
}

// ---------- flow ----------
function buildOrder() {
  let ids = [...BANK.keys()];
  if (S.set === 'hard') ids = ids.filter(i => hard.has(i));
  if (S.order === 'shuffle') for (let i = ids.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [ids[i], ids[j]] = [ids[j], ids[i]]; }
  order = ids;
}
function cur() { return BANK[order[oi]]; }
function loadQ(startWords = true) {
  clearTimeout(tmr); cancelAnimationFrame(raf);
  if (!order.length) { $('#word').className = 'word free'; $('#word').innerHTML = 'No questions marked hard yet'; return; }
  oi = Math.max(0, Math.min(oi, order.length - 1)); store.set('last', S.set === 'all' && S.order === 'seq' ? oi : 0);
  tokens = tokenize(cur()[0]); ti = 0; phase = 'words';
  $('#qi').textContent = oi + 1; $('#qn').textContent = order.length;
  $('#prog').style.width = ((oi + 1) / order.length * 100) + '%';
  $('#star').classList.toggle('on', hard.has(order[oi]));
  $('#answer').classList.remove('on'); $('#cue').classList.remove('on'); $('#hold').classList.remove('on'); $('#word').style.opacity = 1;
  showToken(tokens[0]); fillSheet();
  if (playing && startWords) step();
}
function step() {
  clearTimeout(tmr);
  if (!playing) return;
  if (phase === 'gap') { showAnswer(); return; }
  if (phase === 'words') {
    showToken(tokens[ti]);
    const d = delayFor(tokens[ti]);
    tmr = setTimeout(() => { ti++; if (ti >= tokens.length) { phase = 'gap'; if (S.quiz === 'on') { setPlaying(false); return; } tmr = setTimeout(showAnswer, 350); } else step(); }, d);
  } else if (phase === 'answer') runHold();
}
function showAnswer() {
  phase = 'answer'; $('#word').style.opacity = 0; $('#cue').classList.add('on');
  const a = $('#answer'); a.innerHTML = cur()[1]; a.classList.remove('on'); void a.offsetWidth; a.classList.add('on');
  holdStart = performance.now(); runHold();
}
function runHold() {
  $('#hold').classList.add('on'); const total = S.hold * 1000;
  const tick = now => { if (!playing) return; const el = now - holdStart;
    $('#holdBar').style.width = Math.min(100, el / total * 100) + '%';
    if (el >= total) { next(); return; } raf = requestAnimationFrame(tick); };
  raf = requestAnimationFrame(tick);
}
function next() {
  if (oi >= order.length - 1) { setPlaying(false); finished(); return; }
  oi++; loadQ();
}
function prev() { oi = Math.max(0, oi - 1); loadQ(); }
let pausedAt = 0;
function setPlaying(on) {
  if (on && ($('#done').classList.contains('on') || !order.length)) return;
  playing = on; document.body.classList.toggle('playing', on); document.body.classList.toggle('paused', !on);
  $('#play').textContent = on ? 'Pause' : 'Play'; $('#hint').style.opacity = on ? 0 : 1;
  if (!on) { clearTimeout(tmr); cancelAnimationFrame(raf); pausedAt = performance.now(); fillSheet(); }
  else { if (phase === 'answer') holdStart += performance.now() - pausedAt; step(); }
  idle();
}
function finished() { $('#doneMsg').textContent = `You read ${order.length} question${order.length === 1 ? '' : 's'}. ${hard.size} marked hard.`; $('#done').classList.add('on'); }

// ---------- paused sheet: full question, clickable options ----------
let opts = [];
function fillSheet() {
  if (!order.length) return;
  const q = cur();
  $('#full').innerHTML = q[0];
  opts = [q[1], q[2], q[3], q[4]];
  const seed = order[oi] * 7 + 3; opts = opts.map((o, k) => [o, (seed * (k + 1) * 31) % 97]).sort((a, b) => a[1] - b[1]).map(x => x[0]); // stable shuffle per question
  $('#opts').innerHTML = opts.map((o, k) => `<button class="opt" data-k="${k}"><span>${'ABCD'[k]}</span><span>${o}</span></button>`).join('');
  $('#sheetMsg').innerHTML = phase === 'answer' ? `<span class="reveal">${q[1]}</span>` : 'Pick the answer you think is right, or reveal it.';
}
function pick(k) {
  const q = cur(), btns = $$('#opts .opt'), ok = opts[k] === q[1];
  btns.forEach((b, i) => { b.disabled = true; if (opts[i] === q[1]) b.classList.add('ok'); });
  if (!ok) btns[k].classList.add('bad');
  $('#sheetMsg').innerHTML = ok ? '<span class="reveal">Right. Press Space to keep reading.</span>' : `Not quite. The answer is <span class="reveal">${q[1]}</span>`;
}
function reveal() { const q = cur(); $$('#opts .opt').forEach((b, i) => { b.disabled = true; if (opts[i] === q[1]) b.classList.add('ok'); }); $('#sheetMsg').innerHTML = `<span class="reveal">${q[1]}</span>`; }
$('#opts').onclick = e => { const b = e.target.closest('.opt'); if (b && !b.disabled) pick(+b.dataset.k); };
$('#revealBtn').onclick = reveal;

// ---------- controls ----------
function setWpm(v) { S.wpm = Math.max(100, Math.min(900, v)); $('#wpm').value = S.wpm; $('#wpmLbl').textContent = S.wpm + ' wpm'; store.set('wpm', S.wpm); }
setWpm(S.wpm);
$('#wpm').oninput = e => setWpm(+e.target.value);
$('#slower').onclick = () => setWpm(S.wpm - 25); $('#faster').onclick = () => setWpm(S.wpm + 25);
$('#play').onclick = () => setPlaying(!playing);
$('#stage').onclick = () => setPlaying(!playing);
$('#nextQ').onclick = () => { if (oi < order.length - 1) { oi++; loadQ(); } };
$('#prevQ').onclick = prev;
$('#back').onclick = () => loadQ();
function toggleHard() { const id = order[oi]; hard.has(id) ? hard.delete(id) : hard.add(id); store.set('hard', [...hard]); $('#star').classList.toggle('on', hard.has(id)); }
$('#star').onclick = toggleHard;

function seg(id, key, after) {
  const el = $(id); el.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.v) === String(S[key])));
  el.onclick = e => { const b = e.target.closest('button'); if (!b) return; S[key] = isNaN(+b.dataset.v) ? b.dataset.v : +b.dataset.v;
    el.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x === b)); store.set(key, S[key]); after && after(); };
}
seg('#chunkSeg', 'chunk', () => loadQ(false));
seg('#setSeg', 'set', () => { buildOrder(); oi = 0; loadQ(false); });
seg('#ordSeg', 'order', () => { buildOrder(); oi = 0; loadQ(false); });
seg('#quizSeg', 'quiz');
$('#holdSel').value = S.hold; $('#holdSel').onchange = e => { S.hold = +e.target.value; store.set('hold', S.hold); };
$('#jump').onchange = e => { S.set = 'all'; S.order = 'seq'; seg('#setSeg', 'set', () => { buildOrder(); oi = 0; loadQ(false); }); seg('#ordSeg', 'order', () => { buildOrder(); oi = 0; loadQ(false); });
  buildOrder(); oi = Math.max(1, Math.min(175, +e.target.value || 1)) - 1; loadQ(false); };
$('#menuBtn').onclick = e => { e.stopPropagation(); setPlaying(false); $('#menu').classList.add('on'); };
$('#menuClose').onclick = () => $('#menu').classList.remove('on');
$('#again').onclick = () => { $('#done').classList.remove('on'); oi = 0; buildOrder(); loadQ(false); };
$('#hardOnly').onclick = () => { $('#done').classList.remove('on'); S.set = 'hard'; seg('#setSeg', 'set', () => { buildOrder(); oi = 0; loadQ(false); }); buildOrder(); oi = 0; loadQ(false); };

document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
  if ($('#menu').classList.contains('on')) { if (e.key === 'Escape') $('#menu').classList.remove('on'); return; }
  const k = e.key;
  if (k === ' ') { e.preventDefault(); setPlaying(!playing); }
  else if (k === 'ArrowRight') $('#nextQ').click();
  else if (k === 'ArrowLeft') prev();
  else if (k === 'ArrowUp') { e.preventDefault(); setWpm(S.wpm + 25); }
  else if (k === 'ArrowDown') { e.preventDefault(); setWpm(S.wpm - 25); }
  else if (k === 'r' || k === 'R') loadQ();
  else if (k === 'h' || k === 'H') toggleHard();
  else if (k === 'a' || k === 'A') { setPlaying(false); reveal(); }

});

// hide chrome while reading; show on mouse move
let idleT; function idle() { document.body.classList.remove('idle'); clearTimeout(idleT); if (playing) idleT = setTimeout(() => document.body.classList.add('idle'), 1800); }
document.addEventListener('mousemove', idle); document.addEventListener('touchstart', idle);

// pivot position (fixed red guide) — keep focus letter at 40% of the reading box
document.documentElement.style.setProperty('--pivot', '40%');
buildOrder(); loadQ(false);
})();
